name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    # macOS runner is required: rustc cannot cross-compile *-apple-darwin without the macOS SDK.
    # The image ships rustup + cargo + clippy + rustfmt + jq; only the x86_64 target needs adding
    # (done inside scripts/build.sh).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${{ github.ref_name }}"
          if [ "v${pkg_version}" != "${tag}" ]; then
            echo "error: tag ${tag} does not match Cargo.toml version v${pkg_version}" >&2
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Build
        run: ./scripts/build.sh

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=( *-darwin-* )
          [ ${#files[@]} -gt 0 ] || { echo "no build artifacts found in dist/" >&2; exit 1; }
          shasum -a 256 "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
